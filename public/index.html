<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; border: none; }
        .table thead { background-color: #f1f3f5; }
        #authStatus { font-size: 0.9rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 MarketAdmin</span>
            <span id="authStatus" class="text-secondary">Guest Mode</span>
        </div>
    </nav>

    <div class="container py-2">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm mb-4">
                    <h5 class="fw-bold mb-3">Admin Login</h5>
                    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                    <input type="password" id="pass" class="form-control mb-3" placeholder="Password">
                    <button onclick="login()" class="btn btn-primary w-100">Login</button>
                </div>

                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">Add New Product</h5>
                    <div class="mb-2">
                        <label class="small text-muted">Product Name</label>
                        <input type="text" id="pName" class="form-control" placeholder="e.g. iPhone 15">
                    </div>
                    <div class="mb-2">
                        <label class="small text-muted">Price ($)</label>
                        <input type="number" id="pPrice" class="form-control" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="small text-muted">Category</label>
                        <select id="pCat" class="form-select">
                            <option value="">Loading categories...</option>
                        </select>
                    </div>
                    <button onclick="addProduct()" class="btn btn-dark w-100">Create Product</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0">Inventory List</h5>
                        <button onclick="loadProducts()" class="btn btn-sm btn-outline-secondary">Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="list">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
       
        let token = localStorage.getItem('token') || '';

     
        function updateUI() {
            const status = document.getElementById('authStatus');
            if (token) {
                status.innerText = 'Logged in as Admin';
                status.classList.replace('text-secondary', 'text-success');
            } else {
                status.innerText = 'Not authorized';
            }
        }

    
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                const data = await res.json();

                if(res.ok && data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    updateUI();
                    alert('Login successful!');
                    loadProducts(); 
                } else {
                    alert('Login failed: ' + (data.message || 'Invalid credentials'));
                }
            } catch (err) {
                alert('Server error. Check if your backend is running.');
            }
        }

        async function loadCats() {
            try {
                const res = await fetch('/api/categories');
                const cats = await res.json();
                const select = document.getElementById('pCat');
                
                if (cats.length === 0) {
                    select.innerHTML = '<option value="">No categories found</option>';
                    return;
                }

                select.innerHTML = cats.map(c => 
                    `<option value="${c._id}">${c.name}</option>`).join('');
            } catch (err) {
                console.error('Error loading categories');
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                const tbody = document.getElementById('list');

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No products found</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td class="fw-bold">${p.name}</td>
                        <td><span class="badge bg-info text-dark">${p.category ? p.category.name : 'Uncategorized'}</span></td>
                        <td>${Number(p.price).toLocaleString()} $</td>
                        <td class="text-end">
                            <button onclick="del('${p._id}')" class="btn btn-outline-danger btn-sm border-0">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error loading products');
            }
        }
        
        async function addProduct() {
            if (!token) return alert('Please login first!');

            const body = {
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value
            };

            if (!body.name || !body.price || !body.category) {
                return alert('Please fill all fields');
            }

            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });

                if(res.ok) {
                    alert('Product added!');
                    document.getElementById('pName').value = '';
                    document.getElementById('pPrice').value = '';
                    loadProducts();
                } else {
                    const errData = await res.json();
                    alert('Error: ' + (errData.message || 'Check Admin permissions'));
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        async function del(id) {
            if (!token) return alert('Please login as Admin to delete');
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const res = await fetch(`/api/products/${id}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if(res.ok) {
                    loadProducts();
                } else {
                    alert('Action failed. Admin token might be expired.');
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        updateUI();
        loadCats();
        loadProducts();
    </script>
</body>
</html>
