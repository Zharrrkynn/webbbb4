<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Full-Stack Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; transition: 0.3s; }
        .admin-section { border-left: 5px solid #0d6efd; }
        .product-link { cursor: pointer; color: #0d6efd; text-decoration: none; }
        .product-link:hover { text-decoration: underline; }
        .d-none { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🛒 Product Management System</span>
            <div id="authStatus" class="text-light"></div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm mb-4">
                    <ul class="nav nav-pills mb-3" id="pills-tab">
                        <li class="nav-item w-50">
                            <button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#tab-login">Login</button>
                        </li>
                        <li class="nav-item w-50">
                            <button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#tab-reg">Sign Up</button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-login">
                            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                            <input type="password" id="pass" class="form-control mb-3" placeholder="Password">
                            <button onclick="auth('login')" id="loginBtn" class="btn btn-primary w-100">Enter Admin Panel</button>
                        </div>
                        <div class="tab-pane fade" id="tab-reg">
                            <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email">
                            <input type="password" id="regPass" class="form-control mb-3" placeholder="Password">
                            <button onclick="auth('register')" id="regBtn" class="btn btn-success w-100">Create Account</button>
                        </div>
                    </div>
                </div>

                <div id="adminPanel" class="card p-4 shadow-sm admin-section d-none">
                    <h5 class="fw-bold mb-3 text-primary">Add New Product (Admin Only)</h5>
                    <div class="mb-2">
                        <label class="small fw-bold">Name</label>
                        <input type="text" id="pName" class="form-control" placeholder="iPhone 15">
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">Price ($)</label>
                        <input type="number" id="pPrice" class="form-control" placeholder="999">
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">Category</label>
                        <select id="pCat" class="form-select"><option value="">Loading...</option></select>
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">Description</label>
                        <textarea id="pDesc" class="form-control" rows="2" placeholder="Product details..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">Image URL</label>
                        <input type="text" id="pImage" class="form-control" placeholder="https://image.com/pic.jpg">
                    </div>
                    <button onclick="addProduct()" id="addBtn" class="btn btn-dark w-100">Post Product</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold m-0">Inventory List</h4>
                        <button onclick="loadProducts()" class="btn btn-sm btn-outline-secondary">🔄 Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Product Name (click for info)</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th id="actionsHeader" class="text-end d-none">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <img id="mImg" src="" class="img-fluid rounded mb-3" style="max-height: 250px; object-fit: contain;">
                    <h3 id="mName" class="fw-bold"></h3>
                    <span id="mCat" class="badge bg-primary mb-3"></span>
                    <p id="mDesc" class="text-muted text-start px-3"></p>
                    <hr>
                    <h2 id="mPrice" class="text-success fw-bold"></h2>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let token = localStorage.getItem('token') || '';

        function updateUI() {
            const authStatus = document.getElementById('authStatus');
            const adminPanel = document.getElementById('adminPanel');
            const actionsHeader = document.getElementById('actionsHeader');

            if (token) {
                authStatus.innerHTML = `<span>Logged as Admin</span> <button onclick="logout()" class="btn btn-sm btn-outline-danger ms-2">Logout</button>`;
                adminPanel.classList.remove('d-none');
                actionsHeader.classList.remove('d-none');
            } else {
                authStatus.innerHTML = `<span class="badge bg-secondary">Guest Mode</span>`;
                adminPanel.classList.add('d-none');
                actionsHeader.classList.add('d-none');
            }
        }

        function logout() {
            token = '';
            localStorage.removeItem('token');
            location.reload();
        }

        async function auth(type) {
            const email = document.getElementById(type === 'login' ? 'email' : 'regEmail').value;
            const password = document.getElementById(type === 'login' ? 'pass' : 'regPass').value;
            const btn = document.getElementById(type === 'login' ? 'loginBtn' : 'regBtn');

            if (!email || !password) return alert("Fill all fields");
            btn.disabled = true;

            try {
                const res = await fetch(`/api/auth/${type}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password, role: 'admin' })
                });
                const data = await res.json();
                if (res.ok) {
                    if (type === 'login') {
                        token = data.token;
                        localStorage.setItem('token', token);
                        updateUI();
                        loadProducts();
                    } else alert("Registered! Now login.");
                } else alert(data.message || "Error");
            } catch (e) { alert("Server error"); }
            finally { btn.disabled = false; }
        }

        async function loadCats() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            document.getElementById('pCat').innerHTML = cats.map(c => `<option value="${c._id}">${c.name}</option>`).join('');
        }

        async function loadProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            const tbody = document.getElementById('list');
            
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>
                        <a href="javascript:void(0)" onclick="viewProduct('${p._id}')" class="product-link fw-bold">${p.name}</a>
                    </td>
                    <td><span class="badge bg-light text-dark border">${p.category?.name || 'Uncategorized'}</span></td>
                    <td class="text-success fw-bold">$${p.price}</td>
                    <td class="text-end ${token ? '' : 'd-none'}">
                        <button onclick="del('${p._id}')" class="btn btn-sm btn-outline-danger">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function viewProduct(id) {
            try {
                const res = await fetch(`/api/products/${id}`);
                const p = await res.json();
                document.getElementById('mName').innerText = p.name;
                document.getElementById('mDesc').innerText = p.description || "No description available.";
                document.getElementById('mPrice').innerText = `$${p.price}`;
                document.getElementById('mCat').innerText = p.category?.name || "Uncategorized";
                document.getElementById('mImg').src = p.image || 'https://via.placeholder.com/300?text=No+Image';
                
                new bootstrap.Modal(document.getElementById('productModal')).show();
            } catch (e) { alert("Error loading details"); }
        }

        async function addProduct() {
            const body = {
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                description: document.getElementById('pDesc').value,
                image: document.getElementById('pImage').value
            };

            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                alert("Product added!");
                loadProducts();
            } else alert("Error adding product");
        }

        async function del(id) {
            if (!confirm("Delete?")) return;
            const res = await fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadProducts();
        }

        
        updateUI();
        loadCats();
        loadProducts();
    </script>
</body>
</html>
